services:
  mongodb:
    image: mongo:latest
    container_name: firesquad-mongodb
    restart: unless-stopped

    ports:
      - "127.0.0.1:27018:27017"

    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}

    volumes:
      - mongodb_data:/data/db

volumes:
  mongodb_data:
